[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-page-library"
version = "0.1.0"
description = "Local macOS PPT page index and composition tool"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "Pillow>=11,<13",
  "python-multipart>=0.0.9,<1",
  "lxml>=5,<7",
  "playwright>=1.49,<2",
  "pypdfium2>=4.30,<5",
  "tinycss2>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.6,<1",
]

[project.scripts]
pptlib = "pptlib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pptlib = [
  "default.toml",
  "migrations/*.sql",
  "web/templates/*.html",
  "web/templates/fragments/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "web/static/vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pptlib"]

[dependency-groups]
dev = [
    "pyinstaller>=6.11,<7",
]
