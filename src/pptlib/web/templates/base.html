<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PPT 页库{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">P</span><span><strong>PPT 页库</strong><small>LOCAL WORKSPACE</small></span></a>
      <nav aria-label="主导航">
        <a class="{% if request.url.path == '/' %}is-active{% endif %}" href="/">导入</a>
        <a class="{% if request.url.path.startswith('/library') %}is-active{% endif %}" href="/library">页面库</a>
        <a class="{% if request.url.path == '/selection' %}is-active{% endif %}" href="/selection">选片单</a>
        <span aria-disabled="true">任务</span>
      </nav>
      <span class="local-status"><i></i>本机运行</span>
      </div>
    </header>
    <main class="page-main">{% block content %}{% endblock %}</main>
  </body>
</html>
